# Development stack: the mini-app proxy plus DUMB STUB SERVICES on the
# internal compose network. Only the app port is published to the host.
#
# Config is mounted from config/ (edit + `compose up -d`, no rebuild):
#   config/app.dev.json     — used AS-IS (testing mode: dev logins + stubs)
#   config/services.dev.json— targets are compose DNS names (stub-game:80 …)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:3000/?devUserId=1
#
# Then verify everything in one command (from the repo root, host side):
#   bun run check http://localhost:3000
#
# The proxy runs in testing mode, so config/app.dev.json applies
# (devAuth + stubUpstreams). Point config/services.dev.json at real
# dashboards instead of stubs and they will be proxied when reachable.

services:
  proxy:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000" # the ONLY published port
    environment:
      TG_MINIAPP_MODE: preview # switches the server to testing config
      PORT: "3000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - stub-game
      - stub-home

  # ── Stub "game dashboard": nginx, zero custom config ─────────────────────
  stub-game:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./stub/game/index.html:/usr/share/nginx/html/index.html:ro
    # no ports: → internal only

  # ── Stub "home dashboard": python stdlib server, zero config ─────────────
  stub-home:
    image: python:3.13-alpine
    restart: unless-stopped
    working_dir: /srv
    command: python3 -m http.server 8123
    expose:
      - "8123"
    volumes:
      - ./stub/home/:/srv/:ro
    # no ports: → internal only
