<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Mini App Proxy — Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #2f6fed;
      --sidebar-width: 17rem;
    }
    .markdown-section img { max-width: 100%; }
  </style>
</head>
<body>
  <div id="app">Loading documentation…</div>
  <script>
    window.$docsify = {
      loadSidebar: true,
      subMaxLevel: 3,
      alias: {
        "/_sidebar.md": "/_sidebar.md",
      },
      search: {
        // Object form required: a truthy string (e.g. "auto") is not handled
        // by the search plugin and breaks its initialization.
        paths: "auto",
        depth: 3,
        placeholder: "Type to search",
        noData: "No results!",
      },
      auto2top: true,
      plugins: [
        // Mermaid support (docsify 4): fenced ```mermaid blocks must become
        // <div class="mermaid"> elements before mermaid.run() is called.
        // beforeEach sees raw markdown, afterEach sees HTML — so extract the
        // fenced source into placeholders first, then swap in rendered divs.
        function (hook) {
          var dict = {};
          hook.beforeEach(function (content) {
            dict = {};
            return content.replace(/```mermaid\n?([\s\S]*?)```/g, function (_, code) {
              var key = "PLCMERMAID" + Object.keys(dict).length + "END";
              dict[key] = code;
              return key;
            });
          });
          hook.afterEach(function (html) {
            Object.keys(dict).forEach(function (key) {
              // Escape so the browser parses the div's text back to the
              // original source (diagram code may contain <, &, quotes).
              var escaped = dict[key]
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;");
              html = html.replace(key, function () {
                return '<div class="mermaid">' + escaped + "</div>";
              });
            });
            return html;
          });
          hook.doneEach(function () {
            if (!window.mermaid) return;
            // Lazy init: mermaid.min.js loads after the $docsify config, so
            // window.mermaid is not available when this script is parsed.
            if (!window.__mermaidReady) {
              window.mermaid.initialize({ startOnLoad: false, theme: "neutral" });
              window.__mermaidReady = true;
            }
            var blocks = document.querySelectorAll(".mermaid:not([data-processed])");
            if (blocks.length === 0) return;
            window.mermaid.run({ nodes: blocks });
            document.querySelectorAll(".mermaid svg").forEach(function (svg) {
              svg.style.maxWidth = "100%";
              svg.style.height = "auto";
            });
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
