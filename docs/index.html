<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Mini App Proxy — Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #2f6fed;
      --sidebar-width: 17rem;
    }
    .markdown-section img { max-width: 100%; }
  </style>
</head>
<body>
  <div id="app">Loading documentation…</div>
  <script>
    window.$docsify = {
      loadSidebar: true,
      subMaxLevel: 3,
      alias: {
        "/_sidebar.md": "/_sidebar.md",
      },
      search: "auto",
      auto2top: true,
      plugins: [
        function (hook) {
          var id = 0;
          hook.afterEach(function () { id = 0; });
          hook.afterEach(function (html) { return html; });
        },
        function (hook, vm) {
          hook.doneEach(function () {
            if (window.mermaid) {
              window.mermaid.initialize({ startOnLoad: false, theme: "neutral" });
              window.mermaid.run({ querySelector: ".mermaid" });
            }
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
