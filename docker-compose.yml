# Production stack: Caddy (automatic HTTPS) + the mini-app proxy.
#
# All app configuration lives in config/ — edit it on the server host, then
# `docker compose up -d` re-applies it WITHOUT a rebuild:
#
#   config/app.json        ← copy from config/app.example.json, fill in
#   config/services.json   ← your real dashboards (127.0.0.1:<port> targets)
#
# Compose-level settings (ports, domain) come from .env next to this file:
#   DOMAIN, ACME_EMAIL, HTTPS_PORT, HTTP_PORT
#
# Update workflow:  git pull && nano config/*.json && docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates + ACME account keys (auto-renew)
      - caddy_config:/config
    depends_on:
      - proxy

  proxy:
    build: .
    restart: unless-stopped
    environment:
      # Production mode: config/app.json is read; app.dev.json is ignored.
      # BOT_TOKEN env var, if set, overrides config/app.json's botToken.
      PORT: 3000
    volumes:
      - ./config:/app/config:ro
    depends_on: []

volumes:
  caddy_data:
  caddy_config:
