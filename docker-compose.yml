# Production stack: Caddy (automatic HTTPS) + the mini-app proxy.
#
# Configure via your .env next to this file (see env.example):
#   DOMAIN=panel.example.com        # DNS A record → this server
#   ACME_EMAIL=you@example.com      # Let's Encrypt registration email
#   HTTPS_PORT=443                  # public HTTPS port (any free port works)
#   HTTP_PORT=80                    # ACME HTTP-01 challenge port (keep 80 if you can)
#   PORT=3000                       # internal app port inside the compose network
#
# Then:
#   docker compose up -d --build
#
# https://$DOMAIN[:$HTTPS_PORT]  →  Caddy (auto-TLS, auto-renew)  →  proxy:3000

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates + ACME account keys
      - caddy_config:/config
    depends_on:
      - proxy

  proxy:
    build: .
    restart: unless-stopped
    environment:
      # Production mode: only .env is read by the server; DEV_AUTH must not
      # be set anywhere. If you keep app config in the compose .env, pass it
      # through explicitly:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-*}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PORT: 3000
    volumes:
      - ./services.json:/app/services.json:ro

volumes:
  caddy_data:
  caddy_config:
